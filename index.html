<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SMILE ROAD 3D METAVERSE 🌐</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#050816;
  font-family:Poppins,sans-serif;
  color:white;
}

/* UI LAYER */
.ui{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  z-index:10;
  background:rgba(5,8,22,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #ffffff10;
}

.logo{
  color:#00e5ff;
  font-weight:700;
  letter-spacing:1px;
}

.nav button{
  background:none;
  border:none;
  color:#aab3c5;
  margin:0 10px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.nav button:hover{
  color:#00e5ff;
  transform:scale(1.1);
}

.panel{
  position:fixed;
  bottom:20px;
  left:20px;
  background:rgba(15,23,42,0.8);
  padding:15px;
  border-radius:12px;
  border:1px solid #ffffff10;
  max-width:260px;
}

.title{
  color:#00e5ff;
  font-weight:700;
  margin-bottom:5px;
}
</style>
</head>

<body>

<!-- UI -->
<div class="ui">
  <div class="logo">SMILE ROAD 3D 🌐</div>

  <div class="nav">
    <button onclick="focusArea('home')">Home</button>
    <button onclick="focusArea('about')">About</button>
    <button onclick="focusArea('videos')">Videos</button>
    <button onclick="focusArea('contact')">Contact</button>
  </div>
</div>

<div class="panel" id="panel">
  <div class="title">Welcome</div>
  <div id="info">Drag to explore the metaverse campus 🌍</div>
</div>

<canvas id="scene"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>

// ===== BASIC SCENE =====
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050816, 5, 20);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  canvas: document.querySelector("#scene"),
  antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);
camera.position.z = 8;

// ===== LIGHTS =====
const light = new THREE.PointLight(0x00e5ff, 1.5);
light.position.set(5,5,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xff4d6d, 0.4);
scene.add(ambient);

// ===== CENTRAL GLOBE (METAVERSE CORE) =====
const globeGeo = new THREE.SphereGeometry(2, 32, 32);
const globeMat = new THREE.MeshStandardMaterial({
  color:0x0f172a,
  emissive:0x00e5ff,
  emissiveIntensity:0.2,
  wireframe:true
});

const globe = new THREE.Mesh(globeGeo, globeMat);
scene.add(globe);

// ===== MODULE NODES =====
function createNode(x,y,z,color,text){
  const geo = new THREE.BoxGeometry(0.6,0.6,0.6);
  const mat = new THREE.MeshStandardMaterial({
    color:color,
    emissive:color,
    emissiveIntensity:0.3
  });

  const cube = new THREE.Mesh(geo,mat);
  cube.position.set(x,y,z);
  cube.userData = {text};
  scene.add(cube);
  return cube;
}

const nodes = [
  createNode(3,1,0,0xff4d6d,"Home Campus"),
  createNode(-3,1,0,0x00e5ff,"About System"),
  createNode(0,3,0,0x7c3aed,"Video Labs"),
  createNode(0,-3,0,0xffcc00,"Contact Hub")
];

// ===== MOUSE CONTROL =====
let mouseX = 0;
let mouseY = 0;

document.addEventListener("mousemove",(e)=>{
  mouseX = (e.clientX/window.innerWidth - 0.5)*2;
  mouseY = (e.clientY/window.innerHeight - 0.5)*2;
});

// ===== ANIMATION LOOP =====
function animate(){
  requestAnimationFrame(animate);

  globe.rotation.y += 0.002;

  scene.rotation.y += mouseX * 0.002;
  scene.rotation.x += mouseY * 0.002;

  renderer.render(scene,camera);
}
animate();

// ===== INTERACTION =====
function focusArea(area){

  const panel = document.getElementById("info");

  if(area==="home"){
    camera.position.set(0,0,8);
    panel.innerHTML = "Home Campus: Central learning hub of SMILE ROAD 🌐";
  }

  if(area==="about"){
    camera.position.set(-3,1,6);
    panel.innerHTML = "About: A 3D metaverse learning system for future education 🧠";
  }

  if(area==="videos"){
    camera.position.set(0,3,6);
    panel.innerHTML = "Videos: Immersive learning simulations coming soon 🎥";
  }

  if(area==="contact"){
    camera.position.set(0,-3,6);
    panel.innerHTML = "Contact: smile@road.edu | Metaverse HQ 📡";
  }
}

// ===== CLICK DETECTION =====
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

window.addEventListener("click",(event)=>{

  pointer.x = (event.clientX/window.innerWidth)*2 - 1;
  pointer.y = -(event.clientY/window.innerHeight)*2 + 1;

  raycaster.setFromCamera(pointer,camera);

  const hits = raycaster.intersectObjects(nodes);

  if(hits.length>0){
    const node = hits[0].object;
    document.getElementById("info").innerHTML =
      "You entered: " + node.userData.text;
  }

});

// ===== RESIZE =====
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
